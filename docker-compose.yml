version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEXTAUTH_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_NAME=منصة - Mansah
      - NEXT_PUBLIC_DEFAULT_CURRENCY=YER
      - NEXT_PUBLIC_COMMISSION_RATE=0.05
    restart: unless-stopped
    # For local development with local PostgreSQL and Redis,
    # uncomment the following and update DATABASE_URL/REDIS_URL in .env:
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    #   redis:
    #     condition: service_healthy

  # Optional: Local PostgreSQL (use Neon for production)
  # postgres:
